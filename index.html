<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso do Vendedor — AutoPeças POS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="tela-login">

  <!-- Lado esquerdo: identidade -->
  <div class="login-arte">
    <div class="marca">
      <span>OFICINA</span><span class="ponto">POS</span>
    </div>

    <div class="login-tacometro">
      <div class="rotulo">// SISTEMA INTERNO DE VENDAS</div>
      <h1>Venda peças, <span>emita notas</span> e atenda seus clientes cadastrados sem sair de um só painel.</h1>
    </div>

    <div class="login-rodape">
      Acesso restrito à equipe de vendas. v0.1.0 — protótipo front-end
    </div>
  </div>

  <!-- Lado direito: formulário -->
  <div class="login-form-wrap">
    <div class="login-card">
      <div class="eyebrow">Área do vendedor</div>
      <h2>Entrar no sistema</h2>

      <form id="form-login">
        <div class="campo">
          <label for="matricula">Matrícula</label>
          <input type="text" id="matricula" placeholder="Ex: V-014" value="V-014" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" value="123456" required>
        </div>
        <div class="campo">
          <label for="loja">Unidade</label>
          <select id="loja">
            <option>Loja Matriz — Campinas</option>
            <option>Filial Valinhos</option>
            <option>Filial Sumaré</option>
          </select>
        </div>

        <button type="submit" class="btn btn-ambar btn-bloco">Entrar e abrir caixa</button>
      </form>

      <div class="login-hint">Protótipo — clique em "Entrar" para ver o painel de vendas.</div>
    </div>
  </div>

</div>

<script>
  document.getElementById('form-login').addEventListener('submit', function (e) {
    e.preventDefault();
    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
